[project]
name = "wind-forecast-portal"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pandas==3.0.5",
    "numpy==2.5.3",
    "pydantic==2.13.5",
    "requests==2.34.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["backend", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
